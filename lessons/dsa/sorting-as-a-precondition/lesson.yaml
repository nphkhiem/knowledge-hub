schemaVersion: 1
id: "dsa.sorting-as-a-precondition"
slug: "sorting-as-a-precondition"
domain: "dsa"
collection: "interview-foundations"
order: 9
difficulty: "easy"
license: "CC-BY-4.0"
title: "Sorting as a Precondition"
durationMinutes: 4
objective: "Explain what having values in order buys the steps that follow, and what it costs to get there, including the arrival order it destroys."
recognitionSignals:
  - "A later step would be cheap on sorted values and expensive on unsorted ones."
  - "The same collection is questioned many times, so one pass to order it is paid once and reused."
  - "Neighboring values matter: duplicates, closest pairs, and grouping all become adjacent once ordered."
  - "Nothing downstream depends on the order the values arrived in."
limitations:
  - "Ordering costs more than a single scan, so sorting to answer one question is slower than just answering it."
  - "The arrival order is destroyed unless it is recorded first, and code that needs it back has to carry it explicitly."
content:
  quickUnderstanding: "quick-understanding.md"
  realWorldApplications: "real-world-applications.md"
  deepDive: "deep-dive.md"
  examples:
    - language: "python"
      file: "examples/ordering_pays.py"
    - language: "typescript"
      file: "examples/ordering-pays.ts"
    - language: "java"
      file: "examples/OrderingPays.java"
    - language: "cpp"
      file: "examples/ordering_pays.cpp"
    - language: "go"
      file: "examples/ordering_pays.go"
scene:
  objects:
    - id: "arrived"
      kind: "array"
      label: "As they arrived"
      values: [38, 5, 91, 23, 8]
    - id: "ordered"
      kind: "array"
      label: "The same five, in order"
      values: [5, 8, 23, 38, 91]
    - id: "question"
      kind: "label"
      text: "Where is 8?"
timeline:
  - id: "scan-everything"
    narration: "In arrival order, nothing rules anything out. Answering means looking at every value."
    actions:
      - type: "highlight"
        objectId: "arrived"
        indices: [0, 1, 2, 3, 4]
        tone: "compare"
  - id: "found-by-scanning"
    narration: "8 turns out to be last, so this took five looks at five values. A longer list costs proportionally more."
    actions:
      - type: "highlight"
        objectId: "arrived"
        indices: [4]
        tone: "success"
  - id: "pay-once"
    narration: "Sorting puts the same five values in order. That is work done once, up front, before any question is asked."
    actions:
      - type: "highlight"
        objectId: "ordered"
        indices: [0, 1, 2, 3, 4]
        tone: "compare"
  - id: "rule-out-half"
    narration: "Now the middle value is worth looking at. It is 23, and 8 is smaller, so 23 and everything right of it is ruled out. Three values gone for one look."
    actions:
      - type: "highlight"
        objectId: "ordered"
        indices: [2]
        tone: "compare"
  - id: "what-it-cost"
    narration: "8 is found in the half that remains. The order bought that, and it cost one sorting pass and the arrival order itself: the lower row no longer knows that 8 came last."
    terminal: true
    actions:
      - type: "highlight"
        objectId: "ordered"
        indices: [1]
        tone: "success"
      - type: "highlight"
        objectId: "arrived"
        indices: [4]
        tone: "compare"
modelCheck:
  prompt: "The collection is questioned once and never again. Is sorting it first worth doing?"
  options:
    - id: "no"
      label: "No, because one scan answers the question for less than sorting costs"
    - id: "yes"
      label: "Yes, because ordered values are always faster to search"
    - id: "depends-size"
      label: "Only if the collection is large"
  correctOptionId: "no"
  explanation: "Sorting is an investment, and one question does not repay it. A single scan costs one pass over the values; sorting costs more than that before the first question is even asked. The trade only pays when the ordering is reused, which is why this is a precondition rather than a step."
accessibility:
  summary: "An animation comparing a search through values in arrival order with the same values in sorted order, where one look rules out most of them."
  initialDescription: "Five values in the order they arrived, the same five in sorted order beneath them, and the question asking where 8 is."
  motionEquivalentLabel: "What ordering buys, step by step"
evidence:
  verifiedOn: "2026-08-15"
  scope: "Describes comparison sorting as preparation for later queries over values that do not change. Sorting algorithms themselves, stability guarantees of particular library implementations, and non-comparison sorts are out of scope."
  sources:
    - title: "The Art of Computer Programming, volume 3, chapter 5: Sorting"
      citation: "Knuth, Donald E. The Art of Computer Programming, Volume 3: Sorting and Searching, 2nd ed. Addison-Wesley, 1998, chapter 5."
      publisher: "Addison-Wesley"
      accessedOn: "2026-08-15"
      supports:
        - "Sorting is frequently performed not for its own sake but to make subsequent operations, particularly searching, more efficient."
        - "A sort is called stable when it preserves the relative order of records with equal keys, which is not guaranteed unless stated."
    - title: "Introduction to Algorithms, fourth edition, chapter 2: Getting Started"
      citation: "Cormen, Leiserson, Rivest, and Stein. Introduction to Algorithms, 4th ed. MIT Press, 2022, chapter 2."
      publisher: "MIT Press"
      accessedOn: "2026-08-15"
      supports:
        - "Searching an unsorted sequence for a value requires examining each element in the worst case, giving a running time linear in the number of elements."
