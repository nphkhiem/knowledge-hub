schemaVersion: 1
id: "dsa.fast-and-slow-pointers"
slug: "fast-and-slow-pointers"
domain: "dsa"
collection: "interview-foundations"
order: 11
difficulty: "medium"
license: "CC-BY-4.0"
title: "Fast and Slow Pointers"
durationMinutes: 5
objective: "Explain how two positions moving at different speeds answer questions about a sequence's shape, such as its midpoint, in one pass without measuring its length first."
recognitionSignals:
  - "Two positions move through the same sequence at different speeds, one step against two."
  - "The answer is a ratio of the sequence rather than a value in it: its middle, or whether it loops."
  - "Detecting a cycle, sometimes called the tortoise and hare or Floyd's algorithm, without recording where you have been."
  - "The length is unknown or costly to measure, so counting it first is not an option."
limitations:
  - "It answers questions about position and shape, never about values. It cannot find where a particular value sits."
  - "On an array the length is already known, so the midpoint is simple arithmetic. This earns its place on a structure that can only be walked forward, such as a linked list, where nothing knows the length until it has been walked."
content:
  quickUnderstanding: "quick-understanding.md"
  realWorldApplications: "real-world-applications.md"
  deepDive: "deep-dive.md"
  examples:
    - language: "python"
      file: "examples/two_speeds.py"
    - language: "typescript"
