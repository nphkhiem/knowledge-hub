name: Deploy

# Production deployment happens only from main, never from a pull request. The
# pull request workflow builds and tests but deliberately publishes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, mint the Pages token, and publish. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer commit wins. In-flight runs are not
# cancelled, because cancelling midway through a deployment can leave the
# environment in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Every expected route was generated
        run: |
          set -euo pipefail
          for route in index.html 404.html lessons/dsa/two-pointers/index.html; do
            test -s "apps/site/dist/$route" || {
              echo "Missing or empty route: $route"
              exit 1
            }
          done
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: The published site serves its critical routes over HTTPS
        env:
          SITE: https://nphkhiem.github.io/knowledge-hub
        run: |
          set -euo pipefail

          # A deployment can take a moment to become visible at the edge.
          for attempt in $(seq 1 10); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' "$SITE/")" = "200" ]; then
              break
            fi
            echo "Waiting for the deployment to become visible (attempt $attempt)"
            sleep 15
          done

          check() {
            local path="$1" expected="$2"
            local status
            status="$(curl -sS -o /tmp/body -w '%{http_code}' "$SITE$path")"
            if [ "$status" != "$expected" ]; then
              echo "FAIL $path expected $expected, got $status"
              return 1
            fi
            echo "ok   $path -> $status"
          }

          check "/" 200
          check "/lessons/dsa/two-pointers/" 200

          # A missing page must serve the project's own 404, not a bare error.
          check "/does-not-exist/" 404
          grep -q "Knowledge Hub" /tmp/body || {
            echo "FAIL the 404 response is not this project's page"
            exit 1
          }
          echo "ok   404 recovery page is this project's own"

          # The lesson must arrive readable without any script running.
          curl -sS "$SITE/lessons/dsa/two-pointers/" -o /tmp/lesson
          for needle in "Two Pointers" "data-motion-equivalent" "data-example-panel"; do
            grep -q "$needle" /tmp/lesson || {
              echo "FAIL the served lesson is missing: $needle"
              exit 1
            }
          done
          echo "ok   the served lesson carries its figures, steps, and samples"
